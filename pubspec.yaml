name: tv_app_books
description: "Burlington - Bookshelf App (Android + Windows + Linux)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  webview_flutter: ^4.4.2
  path_provider: ^2.1.1
  file_picker: ^8.1.2
  archive: ^3.4.0
  path: ^1.9.0
  http: ^1.1.0
  device_info_plus: ^9.1.0
  sqflite: ^2.3.0
  permission_handler: ^11.0.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  workmanager: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/books/