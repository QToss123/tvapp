# Flutter Windows release build (native `flutter build windows`, not Dockerfile.windows).
#
# Configure in GitHub: Settings → Secrets and variables → Actions
#
# | What | How |
# |------|-----|
# | URL | Manual run: workflow input `backend_url`. On push / non-dispatch: repository variable `WINDOWS_BACKEND_URL`. If still empty, defaults to `https://licenses.dbk.burlingtonenglish.in/`. |
# | Env | Manual run: input `build_env` (`Dev` or `Prod`). On push / non-dispatch: variable `WINDOWS_BUILD_ENV`. If empty, defaults to `Prod`. |
# | Key | Repository secret `WINDOWS_BOOK_KEY` → passed as dart-define `BOOK_KEY`. |

name: Flutter Windows Build

on:
  push:
    branches:
      - main
      - Merge_Android_Window_Linux
  workflow_dispatch:
    inputs:
      backend_url:
        description: BACKEND_URL (dart-define). Leave empty to use WINDOWS_BACKEND_URL or the default prod URL below.
        required: false
        default: ''
      build_env:
        description: BUILD_ENV — Dev or Prod (sets PACKAGE_SUFFIX=_Dev / _Prod)
        required: false
        default: 'Prod'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Set build variables (URL, BUILD_ENV)
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $backend = '${{ github.event.inputs.backend_url }}'
            $buildEnv = '${{ github.event.inputs.build_env }}'
          } else {
            $backend = '${{ vars.WINDOWS_BACKEND_URL }}'
            $buildEnv = '${{ vars.WINDOWS_BUILD_ENV }}'
          }

          if ([string]::IsNullOrWhiteSpace($backend)) {
            $backend = 'https://licenses.dbk.burlingtonenglish.in/'
          }

          if ([string]::IsNullOrWhiteSpace($buildEnv)) {
            $buildEnv = 'Prod'
          }

          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "BACKEND_URL=$backend"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "BUILD_ENV=$buildEnv"

          Write-Host "Using BACKEND_URL=$backend"
          Write-Host "Using BUILD_ENV=$buildEnv"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows app
        run: |
          flutter build windows --release `
            --dart-define=BACKEND_URL=$env:BACKEND_URL `
            --dart-define=BUILD_ENV=$env:BUILD_ENV `
            --dart-define=PACKAGE_SUFFIX=_$env:BUILD_ENV `
            --dart-define=BOOK_KEY=${{ secrets.WINDOWS_BOOK_KEY }}

      - name: Prepare artifact
        shell: pwsh
        run: |
          $folder = "windows-release_$env:BUILD_ENV"
          $src = "build/windows/x64/runner/Release"
          $dest = "$env:GITHUB_WORKSPACE\$folder"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force "$src\*" $dest

      - name: Zip artifact
        shell: pwsh
        run: |
          $folder = "windows-release_$env:BUILD_ENV"
          Compress-Archive -Path "$folder\*" -DestinationPath "windows-build.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows-build.zip
          if-no-files-found: error
