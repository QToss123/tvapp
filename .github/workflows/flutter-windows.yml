name: Flutter Windows Build

on:
  push:
    branches:
      - main
      - Merge_Android_Window_Linux
  workflow_dispatch:
    inputs:
      backend_url:
        description: BACKEND_URL (dart-define)
        required: false
        default: ''
      build_env:
        description: BUILD_ENV (Dev or Prod)
        required: false
        default: 'Prod'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Enable Windows desktop
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # Set environment variables
      - name: Set build variables
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $backend = '${{ github.event.inputs.backend_url }}'
            $buildEnv = '${{ github.event.inputs.build_env }}'
          } else {
            $backend = '${{ vars.WINDOWS_BACKEND_URL }}'
            $buildEnv = '${{ vars.WINDOWS_BUILD_ENV }}'
          }

          if ([string]::IsNullOrWhiteSpace($backend)) {
            $backend = 'https://licenses.dbk.burlingtonenglish.in/'
          }

          if ([string]::IsNullOrWhiteSpace($buildEnv)) {
            $buildEnv = 'Prod'
          }

          echo "BACKEND_URL=$backend" >> $env:GITHUB_ENV
          echo "BUILD_ENV=$buildEnv" >> $env:GITHUB_ENV

          Write-Host "Using BACKEND_URL=$backend"
          Write-Host "Using BUILD_ENV=$buildEnv"

      # Install dependencies
      - name: Get dependencies
        run: flutter pub get

      # Build Windows app
      - name: Build Windows app
        run: |
          flutter build windows --release `
            --dart-define=BACKEND_URL=$env:BACKEND_URL `
            --dart-define=BUILD_ENV=$env:BUILD_ENV `
            --dart-define=PACKAGE_SUFFIX=_$env:BUILD_ENV `
            --dart-define=BOOK_KEY=${{ secrets.WINDOWS_BOOK_KEY }}

      # Prepare artifact folder
      - name: Prepare artifact
        shell: pwsh
        run: |
          $folder = "windows-release_$env:BUILD_ENV"
          $src = "build/windows/x64/runner/Release"
          $dest = "$env:GITHUB_WORKSPACE\$folder"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force "$src\*" $dest

      # Zip build
      - name: Zip artifact
        shell: pwsh
        run: |
          $folder = "windows-release_$env:BUILD_ENV"
          Compress-Archive -Path "$folder\*" -DestinationPath "windows-build.zip" -Force

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows-build.zip
          if-no-files-found: error