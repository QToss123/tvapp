include :
  - project: 'devops/ci'
    ref: master
    file: app-template.gitlab-ci.yml

stages:
  - package
  - release

package-linux:
  stage: package
  extends: .package
  variables: 
    DOCKER_FILE: 'linux.Dockerfile'

package-android:
  stage: package
  extends: .package
  variables: 
    DOCKER_FILE: 'android.Dockerfile'

package-windows:
  stage: package
  extends: .package.windows
  variables: 
    DOCKER_FILE: 'windows.Dockerfile'

release-windows:
  needs:
    - package-windows
  stage: release
  extends: .release

release-linux:
  needs:
    - package-linux
    - package-android
  stage: release
  extends: .release