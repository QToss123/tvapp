org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Avoid Gradle 8.14+ strict input tracking issues with Flutter plugin (unreadable pub-cache paths)
